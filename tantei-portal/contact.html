<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掲載に関するお問い合わせ | 全国探偵検索</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Barlow+Condensed:wght@500;600&display=swap');
:root{
  --navy:#0d1b2a;
  --navy-2:#152b40;
  --ink:#1a2430;
  --body:#4a5665;
  --line:#c9d3df;
  --bg:#eef2f7;
  --bg-soft:#dae2ec;
  --card:#f2f5f9;
  --accent:#1668d8;
  --accent-2:#6ea8ee;
  --accent-ink:#0f4fa8;
  --serif:"Zen Old Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  --en:"Barlow Condensed",sans-serif;
}
*{box-sizing:border-box}
body{font-family:var(--sans);margin:0;background:var(--bg);color:var(--body);letter-spacing:.02em}
a{color:inherit}
header{background:var(--navy);color:#fff;padding:34px 16px 30px;text-align:center}
header .eyebrow{display:block;font-family:var(--en);font-size:11px;letter-spacing:.35em;color:var(--accent-2);text-transform:uppercase;margin:0 0 12px}
header h1{margin:0;font-size:1.4rem;font-family:var(--serif);font-weight:700;letter-spacing:.05em;color:#fff}
header p{color:rgba(255,255,255,.72);font-size:.85rem;margin:12px 0 0}
header a{color:rgba(255,255,255,.8);text-decoration:none;font-size:.82rem;display:inline-block;margin-top:16px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:2px;transition:color .3s,border-color .3s}
header a:hover{color:var(--accent-2);border-color:var(--accent-2)}
main{max-width:1000px;margin:0 auto;padding:28px 16px 60px}
.note{background:var(--bg-soft);border-left:3px solid var(--accent);padding:12px 16px;font-size:.85rem;margin-bottom:16px;color:var(--ink)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--line)}
table{width:100%;min-width:680px;border-collapse:collapse;background:#fff;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;word-break:break-word;overflow-wrap:anywhere}
th{background:var(--bg-soft);color:var(--ink);font-weight:500;position:sticky;top:0;white-space:nowrap}
th:nth-child(1){min-width:100px}
th:nth-child(2){min-width:220px}
th:nth-child(3){min-width:260px}
th:nth-child(4){min-width:140px}
tr:hover td{background:var(--card)}
@media (max-width:480px){
  main{padding:16px 12px 44px}
  table{font-size:.8rem}
}
.pref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pref-grid a{display:block;background:var(--card);border:1px solid var(--line);padding:10px;text-decoration:none;color:var(--accent-ink);text-align:center;transition:border-color .3s,color .3s}
.pref-grid a:hover{border-color:var(--accent);color:var(--accent)}
.pref-grid a span{display:block;color:var(--body);font-size:.75rem;margin-top:4px}
.region-block{margin-bottom:20px}
.region-block h2{font-size:1rem;font-family:var(--serif);font-weight:700;color:var(--ink);border-left:3px solid var(--accent);padding-left:10px;margin:0 0 10px}
footer{text-align:center;color:rgba(255,255,255,.55);font-size:.75rem;padding:28px 16px;background:var(--navy)}
footer a{color:rgba(255,255,255,.75);border-bottom:1px solid rgba(255,255,255,.35)}
footer a:hover{color:var(--accent-2);border-color:var(--accent-2)}
.search-box{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.search-box input[type=text]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);font-size:.95rem;font:inherit;color:var(--ink)}
.search-box select{padding:10px 12px;border:1px solid var(--line);font-size:.95rem;background:#fff;font:inherit;color:var(--ink)}
.search-box input:focus,.search-box select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,104,216,.18)}
.search-count{font-size:.8rem;color:var(--body);margin:-8px 0 12px}
.no-hit{padding:24px;text-align:center;color:var(--body)}
#results a.result-item{display:block;background:#fff;border:1px solid var(--line);padding:10px 12px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
#results a.result-item:hover{border-color:var(--accent)}
#results .r-name{font-weight:700;color:var(--accent-ink)}
#results .r-addr{font-size:.85rem;color:var(--body);margin-top:2px}
.mosaic{display:inline-block;filter:blur(3px);user-select:none;color:#555;background:#dfe2e7;padding:0 3px;border-radius:3px;letter-spacing:1px}
.mosaic-note{font-size:.72em;color:#b23b3b;background:#fdecea;border:1px solid #f5c2c0;border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap;display:inline-block}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border:1px solid var(--accent);color:var(--accent-ink);font-size:13.5px;letter-spacing:.1em;font-weight:500;background:transparent;text-decoration:none;transition:background .3s,color .3s,border-color .3s}
.btn:hover{background:var(--accent);color:#fff}
.btn--solid{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 14px 34px -16px rgba(22,104,216,.5)}
.btn--solid:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}

.form-card{background:#fff;border:1px solid var(--line);padding:24px 20px}
.form-card label{display:block;margin:14px 0 6px;font-size:.9rem;color:var(--ink);font-weight:500}
.form-card input[type=text],.form-card textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);font-size:.95rem;font:inherit;color:var(--ink)}
.form-card input:focus,.form-card textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,104,216,.18)}
.form-card textarea{min-height:120px}
.form-card button{margin-top:18px;background:var(--accent);color:#fff;border:1px solid var(--accent);padding:13px 26px;font-size:.95rem;letter-spacing:.08em;cursor:pointer;transition:background .3s,border-color .3s}
.form-card button:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.form-card button[disabled]{opacity:.6;cursor:default}
.form-msg{margin-top:12px;font-size:.9rem}
.form-msg.ok{color:#0f7a3d}
.form-msg.err{color:#c0392b}
</style></head><body>
<header><span class="eyebrow">Tantei Search</span><h1 id="pageTitle">掲載に関するお問い合わせ</h1>
<a href="./index.html">← 一覧に戻る</a></header>
<main>
<div class="note" id="targetNote"></div>
<div class="form-card">
<form id="f">
<label>お名前・貴社名<input type="text" id="name" required></label>
<label>ご連絡先（電話番号またはメールアドレス）<input type="text" id="contact" required></label>
<label>ご要望内容<textarea id="message" placeholder="掲載ページに追加したい情報（サービス内容・強み・写真の希望など）、または削除をご希望の理由をご記入ください"></textarea></label>
<button type="submit" id="btn">送信する</button>
<div class="form-msg" id="formMsg"></div>
</form>
</div>
</main>
<footer>探偵業法に基づく届出情報（R8.5.31時点データ）を基に作成</footer>
<script>
(function(){
  var GAS_URL = "https://script.google.com/macros/s/AKfycbw5fWMGBB5glT-CAK0E_RUurrdMMw8tlRvU2g7dSs0LM2yVP9GJS2K11-pdbtv4BXAJOw/exec";
  var GAS_KEY = "tanteiportal";
  var q = new URLSearchParams(location.search);
  var id = q.get('id') || '';
  var name = q.get('name') || '';
  var type = q.get('type') || 'upgrade';
  var isRemove = type === 'remove';
  document.getElementById('pageTitle').textContent = isRemove ? '掲載情報の削除に関するお問い合わせ' : '掲載ページ充実に関するお問い合わせ';
  var targetText;
  if (name) {
    targetText = '対象：' + name + '（届出番号 ' + id + '）';
  } else if (id) {
    targetText = '対象：届出番号 ' + id + '（業者名は非公開のため表示していません。ご自身の業者名はご記入内容に含めてください）';
  } else {
    targetText = '対象の業者が指定されていません。届出番号がお分かりの場合はご記入内容に含めてください。';
  }
  document.getElementById('targetNote').textContent = targetText;

  function mailFallback(nm, ct, msg){
    var subject = (isRemove ? '【探偵ポータル】掲載削除の希望：' : '【探偵ポータル】掲載ページ充実の希望：') + (name || '（業者名未指定）');
    var body = ['届出番号：' + id, '業者名：' + name, 'お名前：' + nm, 'ご連絡先：' + ct, '', 'ご要望内容：', msg].join('\n');
    location.href = 'mailto:racoontantei@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  var submitId = 'c' + Date.now() + Math.random().toString(36).slice(2, 8);
  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var nm = document.getElementById('name').value.trim();
    var ct = document.getElementById('contact').value.trim();
    var msg = document.getElementById('message').value.trim();
    var btn = document.getElementById('btn');
    var out = document.getElementById('formMsg');
    btn.disabled = true;
    out.className = 'form-msg';
    out.textContent = '送信しています…';
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ key: GAS_KEY, mode: 'contact', id: id, name: name, type: type,
        contactName: nm, contact: ct, message: msg, submitId: submitId })
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok){
        out.className = 'form-msg ok';
        out.textContent = 'お問い合わせを受け付けました。担当者よりご連絡いたします。';
        document.getElementById('f').reset();
      } else {
        throw new Error((j && j.error) || '送信に失敗しました');
      }
    }).catch(function(){
      out.className = 'form-msg err';
      out.textContent = '送信できませんでした。お手数ですがメールでお送りします。';
      mailFallback(nm, ct, msg);
    }).finally(function(){ btn.disabled = false; });
  });
})();
</script>
</body></html>
