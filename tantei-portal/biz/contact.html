<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掲載に関するお問い合わせ | 全国探偵業者一覧</title>
<style>
body{font-family:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;margin:0;background:#f7f8fa;color:#222}
header{background:#0f4fa8;color:#fff;padding:24px 16px;text-align:center}
header h1{margin:0;font-size:1.3rem}
header a{color:#cfe0ff;text-decoration:none;font-size:.85rem}
main{max-width:1000px;margin:0 auto;padding:16px}
.note{background:#fff8e1;border:1px solid #f0d98c;padding:10px 14px;border-radius:6px;font-size:.85rem;margin-bottom:16px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #e3e6ea;border-radius:6px}
table{width:100%;min-width:680px;border-collapse:collapse;background:#fff;font-size:.85rem}
th,td{border-bottom:1px solid #e3e6ea;padding:6px 8px;text-align:left;vertical-align:top;word-break:break-word;overflow-wrap:anywhere}
th{background:#eef3fb;position:sticky;top:0;white-space:nowrap}
th:nth-child(1){min-width:100px}
th:nth-child(2){min-width:220px}
th:nth-child(3){min-width:260px}
th:nth-child(4){min-width:140px}
tr:hover td{background:#f5f9ff}
@media (max-width:480px){
  main{padding:8px}
  table{font-size:.8rem}
}
.pref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pref-grid a{display:block;background:#fff;border:1px solid #e3e6ea;border-radius:6px;padding:10px;text-decoration:none;color:#0f4fa8;text-align:center}
.pref-grid a span{display:block;color:#888;font-size:.75rem;margin-top:4px}
.region-block{margin-bottom:20px}
.region-block h2{font-size:1rem;color:#333;border-left:4px solid #0f4fa8;padding-left:8px;margin:0 0 10px}
footer{text-align:center;color:#999;font-size:.75rem;padding:24px}
.search-box{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.search-box input[type=text]{flex:1;min-width:200px;padding:10px 12px;border:1px solid #ccd3dc;border-radius:6px;font-size:.95rem}
.search-box select{padding:10px 12px;border:1px solid #ccd3dc;border-radius:6px;font-size:.95rem;background:#fff}
.search-count{font-size:.8rem;color:#666;margin:-8px 0 12px}
.no-hit{padding:24px;text-align:center;color:#888}
#results a.result-item{display:block;background:#fff;border:1px solid #e3e6ea;border-radius:6px;padding:10px 12px;margin-bottom:8px;text-decoration:none;color:#222}
#results a.result-item:hover{background:#f5f9ff}
#results .r-name{font-weight:bold;color:#0f4fa8}
#results .r-addr{font-size:.85rem;color:#666;margin-top:2px}

.form-card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:20px}
.form-card label{display:block;margin:14px 0 6px;font-size:.9rem;color:#444}
.form-card input[type=text],.form-card textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd3dc;border-radius:6px;font-size:.95rem}
.form-card textarea{min-height:120px}
.form-card button{margin-top:18px;background:#0f4fa8;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-size:.95rem;cursor:pointer}
.form-card button[disabled]{opacity:.6;cursor:default}
.form-msg{margin-top:12px;font-size:.9rem}
.form-msg.ok{color:#0f7a3d}
.form-msg.err{color:#c0392b}
</style></head><body>
<header><h1 id="pageTitle">掲載に関するお問い合わせ</h1>
<a href="./index.html">← 一覧に戻る</a></header>
<main>
<div class="note" id="targetNote"></div>
<div class="form-card">
<form id="f">
<label>お名前・貴社名<input type="text" id="name" required></label>
<label>ご連絡先（電話番号またはメールアドレス）<input type="text" id="contact" required></label>
<label>ご要望内容<textarea id="message" placeholder="掲載ページに追加したい情報（サービス内容・強み・写真の希望など）、または削除をご希望の理由をご記入ください"></textarea></label>
<button type="submit" id="btn">送信する</button>
<div class="form-msg" id="formMsg"></div>
</form>
</div>
</main>
<footer>探偵業法に基づく届出情報（R8.5.31時点データ）を基に作成</footer>
<script>
(function(){
  var GAS_URL = "https://script.google.com/macros/s/AKfycbw5fWMGBB5glT-CAK0E_RUurrdMMw8tlRvU2g7dSs0LM2yVP9GJS2K11-pdbtv4BXAJOw/exec";
  var GAS_KEY = "tanteiportal";
  var q = new URLSearchParams(location.search);
  var id = q.get('id') || '';
  var name = q.get('name') || '';
  var type = q.get('type') || 'upgrade';
  var isRemove = type === 'remove';
  document.getElementById('pageTitle').textContent = isRemove ? '掲載情報の削除に関するお問い合わせ' : '掲載ページ充実に関するお問い合わせ';
  document.getElementById('targetNote').textContent = (name || id) ? ('対象：' + name + '（届出番号 ' + id + '）') : '対象の業者が指定されていません。届出番号がお分かりの場合はご記入内容に含めてください。';

  function mailFallback(nm, ct, msg){
    var subject = (isRemove ? '【探偵ポータル】掲載削除の希望：' : '【探偵ポータル】掲載ページ充実の希望：') + (name || '（業者名未指定）');
    var body = ['届出番号：' + id, '業者名：' + name, 'お名前：' + nm, 'ご連絡先：' + ct, '', 'ご要望内容：', msg].join('\n');
    location.href = 'mailto:racoontantei@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  var submitId = 'c' + Date.now() + Math.random().toString(36).slice(2, 8);
  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var nm = document.getElementById('name').value.trim();
    var ct = document.getElementById('contact').value.trim();
    var msg = document.getElementById('message').value.trim();
    var btn = document.getElementById('btn');
    var out = document.getElementById('formMsg');
    btn.disabled = true;
    out.className = 'form-msg';
    out.textContent = '送信しています…';
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ key: GAS_KEY, mode: 'contact', id: id, name: name, type: type,
        contactName: nm, contact: ct, message: msg, submitId: submitId })
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok){
        out.className = 'form-msg ok';
        out.textContent = 'お問い合わせを受け付けました。担当者よりご連絡いたします。';
        document.getElementById('f').reset();
      } else {
        throw new Error((j && j.error) || '送信に失敗しました');
      }
    }).catch(function(){
      out.className = 'form-msg err';
      out.textContent = '送信できませんでした。お手数ですがメールでお送りします。';
      mailFallback(nm, ct, msg);
    }).finally(function(){ btn.disabled = false; });
  });
})();
</script>
</body></html>
