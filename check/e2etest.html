<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>e2e</title>
</head>
<body style="margin:0">
<!-- 本番オリジンでの動作確認用（確認後に削除する） -->
<iframe id="f" src="/check/?embed=1" style="width:390px;height:2400px;border:0"></iframe>
<pre id="out" style="font:12px/1.6 monospace;white-space:pre-wrap"></pre>
<script>
var log = [];
function say(s) { log.push(s); document.getElementById('out').textContent = log.join('\n'); }
var f = document.getElementById('f');
f.onload = function () {
  var w = f.contentWindow, d = f.contentDocument;
  w.onerror = function (m) { say('JSエラー: ' + m); };
  setTimeout(function () {
    try { run(w, d); } catch (e) { say('例外: ' + e); }
  }, 400);
};
function run(w, d) {
  for (var n = 0; n < 12; n++) {
    var opts = d.querySelectorAll('#opts .opt');
    if (!opts.length) { say('選択肢なし(' + (n + 1) + '問目)'); return; }
    opts[opts.length - 1].click();
  }
  say('結果: ' + d.getElementById('resLevel').textContent.trim());
  var href = d.getElementById('getLine').href;
  say('LINE本文: ' + decodeURIComponent(href.slice(href.indexOf('/?') + 2)).replace(/\n/g, ' / '));

  d.getElementById('g-mail').value = 'racoontantei@gmail.com';
  d.getElementById('g-agree').checked = true;
  d.getElementById('getMailGo').click();
  say('送信中…');
  var t0 = Date.now(), tries = 0;
  var iv = setInterval(function () {
    tries++;
    var m = d.getElementById('getMsg').textContent.trim();
    if (m) { clearInterval(iv); say('メール送信の結果: ' + m); say('完了'); }
    else if (tries > 120) { clearInterval(iv); say('応答なし（' + Math.round((Date.now() - t0) / 1000) + '秒）'); }
  }, 500);
}
</script>
</body>
</html>
