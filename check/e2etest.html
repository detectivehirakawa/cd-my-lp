<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>e2e</title><meta name="robots" content="noindex,nofollow">
<style>body{font:13px/1.6 monospace;margin:0}#f{width:390px;height:700px;border:0}pre{padding:10px;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="/check/"></iframe>
<pre id="log">running...</pre>
<script>
var out = [];
function log(s) { out.push(s); document.getElementById('log').textContent = out.join('\n'); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

window.addEventListener('load', async function () {
  var fr = document.getElementById('f');
  var doc = fr.contentDocument, win = fr.contentWindow;

  log('GAS_URL = ' + (win.GAS_URL ? 'set' : 'EMPTY'));

  // 12問を実際にボタンで押して進む（choose→finish の実経路を通す）
  var picks = [2, 3, 2, 3, 2, 2, 3, 2, 1, 2, 2, 1];
  for (var i = 0; i < 12; i++) {
    var btns = doc.querySelectorAll('#opts .opt');
    if (btns.length === 0) { log('NG: 選択肢が出ていない (q' + (i + 1) + ')'); break; }
    btns[picks[i]].click();
    await wait(30);
  }
  var shown = win.getComputedStyle(doc.getElementById('result')).display;
  log('結果画面: ' + shown + ' / 点数: ' +
    doc.getElementById('resHero').querySelector('.res-score').textContent.trim());
  log('レベル: ' + doc.getElementById('resLevel').textContent.trim());
  log('AIブロック: ' + win.getComputedStyle(doc.getElementById('ai-wrap')).display);

  // --- AI所見（同意チェック忘れの挙動 → 同意して実行） ---
  doc.getElementById('aiGo').click();
  await wait(200);
  log('同意なしで押した場合: ' + (doc.getElementById('aiErr').textContent.trim() || '（警告なし＝NG）'));

  doc.getElementById('free').value = 'ここ1か月、帰りが遅い日が増えました。スマホを裏返して置くようになりました。';
  doc.getElementById('free').dispatchEvent(new Event('input'));
  doc.getElementById('consent').checked = true;
  doc.getElementById('aiGo').click();
  log('AI所見を要求…');

  for (var t = 0; t < 60; t++) {
    await wait(1000);
    var body = doc.getElementById('aiBody').textContent.trim();
    var err = doc.getElementById('aiErr').textContent.trim();
    if (err) { log('NG エラー: ' + err); break; }
    if (body && body.length > 40) {
      log('OK 所見 ' + body.length + '字（' + (t + 1) + '秒）');
      log('---\n' + body.slice(0, 300));
      log('ボタン非表示: ' + (doc.getElementById('aiGo').style.display === 'none'));
      break;
    }
    if (t === 59) log('NG タイムアウト');
  }

  // --- メール相談フォーム ---
  doc.getElementById('toForm').click();
  await wait(300);
  log('\nフォーム表示: ' + win.getComputedStyle(doc.getElementById('formsec')).display);
  log('添付情報: ' + doc.getElementById('attachInfo').textContent.replace(/\s+/g, ' ').slice(0, 150));

  doc.getElementById('fSubmit').click();
  await wait(200);
  log('未入力で送信: ' + (doc.getElementById('fErr').textContent.trim() || '（警告なし＝NG）'));

  doc.getElementById('f-name').value = '【動作テスト】本番経路の確認';
  doc.getElementById('f-contact').value = 'test@example.com';
  doc.getElementById('f-msg').value = 'フロント経由の送信テストです。返信不要です。';
  doc.getElementById('f-agree').checked = true;
  doc.getElementById('fSubmit').click();
  log('送信…');
  for (var u = 0; u < 40; u++) {
    await wait(1000);
    if (win.getComputedStyle(doc.getElementById('okBox')).display !== 'none') {
      log('OK 送信完了の表示に切り替わった（' + (u + 1) + '秒）'); break;
    }
    var fe = doc.getElementById('fErr').textContent.trim();
    if (fe) { log('NG 送信エラー: ' + fe); break; }
    if (u === 39) log('NG 送信タイムアウト');
  }

  log('\nDONE');
});
</script>
</body>
</html>
