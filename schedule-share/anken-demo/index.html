<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html{color-scheme:light}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>探偵案件連携システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 業務ツール: 上部に役割切替バー、下に「要対応」を先頭に置く1カラム。スマホでは現場モードの大ボタンが主役 */
:root{
  --bg:#f2f4f8;--surface:#ffffff;--sunk:#e9edf3;--ink:#152030;--muted:#5a6678;--line:#d6dde7;
  --accent:#1a5fc7;--accent-ink:#ffffff;--accent-soft:#e2ecfb;
  --ok:#1b7a4b;--ok-soft:#dff2e8;--warn:#9a5c00;--warn-soft:#fbefd9;--crit:#c0302a;--crit-soft:#fbe3e1;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-body:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a;--surface:#161d27;--sunk:#111821;--ink:#e5eaf1;--muted:#98a4b5;--line:#293343;
  --accent:#6fa1f2;--accent-ink:#0a1220;--accent-soft:#1b2a41;
  --ok:#5ec48d;--ok-soft:#14281e;--warn:#e2a64a;--warn-soft:#2c2312;--crit:#f27b73;--crit-soft:#341a1a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a;--surface:#161d27;--sunk:#111821;--ink:#e5eaf1;--muted:#98a4b5;--line:#293343;
  --accent:#6fa1f2;--accent-ink:#0a1220;--accent-soft:#1b2a41;
  --ok:#5ec48d;--ok-soft:#14281e;--warn:#e2a64a;--warn-soft:#2c2312;--crit:#f27b73;--crit-soft:#341a1a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-family:var(--f-disp);font-weight:700;font-size:16px;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
select.who{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tabs{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .badge{margin-left:6px}
main{max-width:1080px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;gap:20px}
.note{max-width:1080px;margin:0 auto;padding:8px 16px 0;font-size:12.5px;color:var(--muted)}
h1{font-family:var(--f-disp);font-size:22px;margin:0;text-wrap:balance;line-height:1.35}
h2{font-family:var(--f-disp);font-size:16px;margin:0 0 10px;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.todo .panel{display:flex;flex-direction:column;gap:8px}
.todo .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.todo .n{font-family:var(--f-mono);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.todo .panel.hot{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.todo .panel.fire{border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
.todo .empty{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:8px 10px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .t{flex:1;min-width:0;font-size:13.5px}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{color:var(--muted);font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--crit);color:var(--surface);font-size:11px;font-family:var(--f-mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dl.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mask{letter-spacing:.15em;color:var(--muted)}
.secret{background:var(--sunk);border:1px dashed var(--line)}
.secret .lock{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.face{width:72px;height:88px;border-radius:6px;background:var(--line);display:grid;place-items:center;flex:none}
.face svg{width:44px;height:44px;fill:var(--muted)}
.face.blur{filter:blur(6px)}
.flex{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:3.6em 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline li:last-child{border-bottom:0}
.timeline time{font-family:var(--f-mono);color:var(--muted);font-size:13px;padding-top:1px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.form .wide{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.field-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field-btns button{min-height:68px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-disp);font-weight:700;font-size:17px;cursor:pointer}
.field-btns button.info{border-color:var(--accent);color:var(--accent)}
.field-btns button.warn{border-color:var(--warn);color:var(--warn)}
.field-btns button.crit{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.field-btns button.ok{border-color:var(--ok);color:var(--ok)}
.field-btns button.end{grid-column:1/-1;background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field-btns button:disabled{opacity:.35;cursor:not-allowed}
.now{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--sunk)}
.now .big{font-family:var(--f-disp);font-weight:700;font-size:20px}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.live .panel.crit{border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
.poll{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.mail{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--sunk);cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.mail:hover{border-color:var(--accent)}
.mail.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:middle}
.mailbody{white-space:pre-wrap;font-size:14px;background:var(--sunk);border-radius:8px;padding:14px;font-family:var(--f-body);margin:0;overflow-x:auto}
.modal{position:fixed;inset:0;z-index:50;background:rgb(10 15 25 / .55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.report{background:#fff;color:#111;border:1px solid #ccc;padding:28px 26px;font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:14px;line-height:1.8}
.report h3{text-align:center;font-size:20px;letter-spacing:.4em;margin:0 0 18px}
.report table{font-size:13.5px}
.report th,.report td{border:1px solid #999;color:#111}
.report th{background:#f2f2f2;width:7.5em}
.report .tl td:first-child{white-space:nowrap;width:6.5em}
.report .end{text-align:right;margin-top:14px}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.hint b{color:var(--ink)}
.alert-strip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:10px 12px;font-weight:600}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">探偵案件連携システム<small>元請け⇔下請け 案件・現場・報告書（たたき台）</small></div>
    <div class="seg" role="group" aria-label="表示する立場">
      <button id="r_prime" data-act="role" data-role="prime">元請け</button>
      <button id="r_sub" data-act="role" data-role="sub">下請け</button>
    </div>
    <select class="who" id="who" aria-label="ログイン中の下請け"></select>
    <button class="btn sm" id="bell" data-act="alerts" hidden>通知</button>
    <a class="btn sm" href="../" style="text-decoration:none">← タンテーTOWN</a>
    <button class="btn sm" data-act="reset">デモを初期化</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="画面"></nav>
</header>
<p class="note">架空データで動くデモです。本番はGoogleスプレッドシート＋GAS（月額0円）で同じ画面を動かします。右上で「元請け／下請け」を切り替えると、同じ案件を双方の立場で確認できます。</p>
<main id="view"></main>
<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const PRIME = {name:'ラクーン探偵社'};
const SUBS = [
  {id:'s1',name:'北村 誠',org:'北村リサーチ',lic:'43-000101（例）',email:'kitamura@example.jp'},
  {id:'s2',name:'森 早紀',org:'森調査オフィス',lic:'13-000202（例）',email:'mori@example.jp'},
  {id:'s3',name:'石田 亮',org:'石田探偵事務所',lic:'12-000303（例）',email:'ishida@example.jp'},
  {id:'s4',name:'大西 拓',org:'大西調査',lic:'11-000404（例）',email:'onishi@example.jp'}
];
const EV = {arrived:{l:'現着',c:'info'},stakeout:{l:'張り込み開始',c:'info'},moving:{l:'対象者移動',c:'warn'},lost:{l:'失尾',c:'crit'},found:{l:'再捕捉',c:'ok'},end:{l:'調査終了',c:'muted'}};
const KINDS = {highway:'高速代',parking:'駐車場代',fuel:'燃料代',train:'電車代',other:'その他'};
const POLL = 15;
const WD = '日月火水木金土';

/* ---------- 日付 ---------- */
function dayAt(off,h,m){const d=new Date();d.setDate(d.getDate()+off);d.setHours(h,m,0,0);return d.toISOString()}
function ago(min){return new Date(Date.now()-min*60000).toISOString()}
const D = s => new Date(s);
const p2 = n => String(n).padStart(2,'0');
const md = s => {const d=D(s);return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`};
const hm = s => {const d=D(s);return `${p2(d.getHours())}:${p2(d.getMinutes())}`};
const reiwa = s => {const d=D(s);return `令和${d.getFullYear()-2018}年${d.getMonth()+1}月${d.getDate()}日`};
const jhm = s => {const d=D(s);return `${d.getHours()}時${p2(d.getMinutes())}分`};
const sameDay = (a,b) => D(a).toDateString()===D(b).toDateString();
const yen = n => '¥'+Number(n||0).toLocaleString('ja-JP');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subOf = id => SUBS.find(s=>s.id===id)||{name:'?',org:''};

/* ---------- 初期データ（架空） ---------- */
function seed(){
  return {
    ui:{role:'prime',sub:'s1',tab:'dash',param:null},
    seq:5, mails:[], alerts:[],
    cases:[
      {id:'c1',code:'R8-1006-01',title:'浮気調査（行動確認）',start:dayAt(0,18,0),hours:5,area:'埼玉県三郷市',fee:3000,head:2,public:false,
       secret:{name:'甲野 一郎',feature:'40代男性・170cm前後・短髪・眼鏡',addr:'埼玉県三郷市〇〇町1-2-3',work:'〇〇株式会社 三郷営業所',car:'白のプリウス（越谷 300 さ 12-34）',pre:'平日は18時前後に退社。火曜は駅前の飲食店に寄る傾向あり（依頼者談）。'},
       assign:{s1:{status:'accepted',at:ago(300)},s2:{status:'offered',at:ago(60)}},events:[],logs:[],claims:{},delivery:null,confirmed:false},
      {id:'c2',code:'R8-1006-02',title:'素行調査（勤務後の行動）',start:ago(150),hours:6,area:'東京都葛飾区',fee:2800,head:1,public:false,
       secret:{name:'乙山 次郎',feature:'30代男性・細身・黒のリュック',addr:'東京都葛飾区〇〇4-5-6',work:'自営（〇〇工務店）',car:'黒の軽バン（足立 480 あ 56-78）',pre:'午前中は現場仕事。昼過ぎに新小岩方面へ移動することが多い。'},
       assign:{s3:{status:'accepted',at:ago(1500)}},
       events:[{sub:'s3',type:'arrived',at:ago(140)},{sub:'s3',type:'stakeout',at:ago(128)},{sub:'s3',type:'moving',at:ago(22),note:'車両で南方向へ'}],
       logs:[{id:'l1',sub:'s3',at:ago(126),body:'対象者宅前にて張り込み開始。対象車両は駐車場に在り。'},{id:'l2',sub:'s3',at:ago(24),body:'対象者が自宅から出て対象車両に乗車。'},{id:'l3',sub:'s3',at:ago(21),body:'対象車両が発進、環七通りを南方向へ。追尾開始。'}],
       claims:{},delivery:null,confirmed:false},
      {id:'c3',code:'R8-1002-01',title:'浮気調査（行動確認）',start:dayAt(-4,17,30),hours:5,area:'埼玉県八潮市',fee:3200,head:1,public:false,
       secret:{name:'丙田 三郎',feature:'30代男性・紺のスーツ・ビジネスバッグ',addr:'埼玉県八潮市〇〇7-8-9',work:'〇〇株式会社 八潮営業所',car:'なし（電車通勤）',pre:'金曜は帰宅が遅い（依頼者談）。'},
       assign:{s1:{status:'finished',at:ago(9000)}},
       events:[{sub:'s1',type:'arrived',at:dayAt(-4,17,20)},{sub:'s1',type:'stakeout',at:dayAt(-4,17,32)},{sub:'s1',type:'moving',at:dayAt(-4,18,2)},{sub:'s1',type:'end',at:dayAt(-4,22,30)}],
       logs:[
        {id:'l4',sub:'s1',at:dayAt(-4,18,2),body:'対象者が勤務先から退社。徒歩で八潮駅方面へ向かう。'},
        {id:'l5',sub:'s1',at:dayAt(-4,18,15),body:'八潮駅よりつくばエクスプレス上り電車に乗車。'},
        {id:'l6',sub:'s1',at:dayAt(-4,18,41),body:'北千住駅で下車。'},
        {id:'l7',sub:'s1',at:dayAt(-4,18,52),body:'対象者が駅西口の飲食店へ入店。'},
        {id:'l8',sub:'s1',at:dayAt(-4,20,31),body:'対象者が女性（30代前半・黒髪ロング・ベージュのコート）と2人で退店。'},
        {id:'l9',sub:'s1',at:dayAt(-4,20,45),body:'2人でタクシーに乗車。追尾開始。'},
        {id:'l10',sub:'s1',at:dayAt(-4,21,3),body:'足立区内の集合住宅へ2人で入る。'},
        {id:'l11',sub:'s1',at:dayAt(-4,22,30),body:'張り込みを継続するも出てこず。本日の調査を終了。'}],
       claims:{s1:{ext:60,items:[{k:'train',amt:1240},{k:'other',amt:2800,memo:'タクシー追尾'}],status:'submitted'}},
       delivery:{sub:'s1',url:'https://drive.google.com/drive/folders/（例）',at:ago(4000)},confirmed:false},
      {id:'c4',code:'R8-1010-01',title:'所在調査（張り込み）',start:dayAt(4,9,0),hours:8,area:'埼玉県越谷市',fee:2700,head:2,public:true,
       secret:{name:'丁原 四郎',feature:'50代男性・やや大柄',addr:'埼玉県越谷市〇〇10-11',work:'不明',car:'シルバーのセダン（ナンバー未確認）',pre:'朝8時台に外出する可能性あり。'},
       assign:{},events:[],logs:[],claims:{},delivery:null,confirmed:false}
    ]
  };
}
let S;
function load(){try{const t=localStorage.getItem('anken-demo-v1');if(t){S=JSON.parse(t);return}}catch(e){}S=seed();seedMails()}
function save(){try{localStorage.setItem('anken-demo-v1',JSON.stringify(S))}catch(e){}}
function seedMails(){
  S.mails.push({id:'m1',to:'s2',caseId:'c1',at:ago(60),kind:'offer',read:false});
  S.mails.push({id:'m2',to:'s1',caseId:'c1',at:ago(320),kind:'offer',read:true});
}

/* ---------- 状態の判定 ---------- */
const caseOf = id => S.cases.find(c=>c.id===id);
const ended = c => c.events.some(e=>e.type==='end');
const accepted = c => Object.entries(c.assign).filter(([,a])=>a.status==='accepted'||a.status==='finished').map(([k])=>k);
const pending = c => Object.entries(c.assign).filter(([,a])=>a.status==='offered'||a.status==='applied').map(([k])=>k);
function phase(c){
  if(c.confirmed) return {k:'closed',l:'完了',c:'ok'};
  if(c.delivery) return {k:'delivered',l:'納品確認待ち',c:'warn'};
  if(ended(c)) return {k:'finished',l:'納品待ち',c:'warn'};
  if(c.events.length) return {k:'active',l:'調査中',c:'info'};
  if(accepted(c).length>=c.head) return {k:'assigned',l:'アサイン確定',c:'ok'};
  if(accepted(c).length||pending(c).length) return {k:'partial',l:accepted(c).length?`${accepted(c).length}/${c.head}名確定`:'回答待ち',c:'warn'};
  return {k:'open',l:'アサイン未定',c:'crit'};
}
const lastEv = c => c.events[c.events.length-1];
/* 秘匿情報を見せてよいか：受諾済み かつ 調査終了前 */
function canSee(c,sid){const a=c.assign[sid];return !!a && a.status==='accepted' && !ended(c)}
const pill = (t,c='') => `<span class="pill ${c}">${esc(t)}</span>`;
const caseRow = (c,extra,act='case') => `<button class="row" data-act="go" data-tab="${act}" data-id="${c.id}"><span class="t"><b>${esc(c.title)}</b><span class="mono">${md(c.start)} ${hm(c.start)}〜</span><span> ・ ${esc(c.area)}</span></span>${extra||''}</button>`;
const LOCK = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;flex:none"><path d="M7 10V7a5 5 0 0 1 10 0v3h1.5A1.5 1.5 0 0 1 20 11.5v9A1.5 1.5 0 0 1 18.5 22h-13A1.5 1.5 0 0 1 4 20.5v-9A1.5 1.5 0 0 1 5.5 10zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>';
const faceSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.6 4.3-7 8.5-7s7.7 2.4 8.5 7z"/></svg>';

/* ---------- 共通UI ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').hidden=false}
function closeModal(){document.getElementById('modal').hidden=true}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

const TABS = {
  prime:[['dash','ダッシュボード'],['cases','案件'],['live','ライブ状況'],['money','精算']],
  sub:[['dash','ダッシュボード'],['mail','メール'],['board','募集案件'],['field','現場モード'],['money','精算']]
};
function render(){
  const u=S.ui;
  document.getElementById('r_prime').setAttribute('aria-pressed',u.role==='prime');
  document.getElementById('r_sub').setAttribute('aria-pressed',u.role==='sub');
  const who=document.getElementById('who');
  who.hidden=u.role!=='sub';
  who.innerHTML=SUBS.map(s=>`<option value="${s.id}" ${s.id===u.sub?'selected':''}>${esc(s.name)}（${esc(s.org)}）</option>`).join('');
  const bell=document.getElementById('bell');
  const unread=S.alerts.filter(a=>!a.read).length;
  bell.hidden=u.role!=='prime';
  bell.innerHTML=`通知${unread?` <span class="badge">${unread}</span>`:''}`;
  const top={case:'cases',new:'cases',answer:'mail',scase:'board'}[u.tab]||u.tab;
  document.getElementById('tabs').innerHTML=TABS[u.role].map(([k,l])=>{
    let b='';
    if(u.role==='sub'&&k==='mail'){const n=S.mails.filter(m=>m.to===u.sub&&!m.read).length;if(n)b=`<span class="badge">${n}</span>`}
    if(u.role==='prime'&&k==='live'){const n=S.cases.filter(c=>{const e=lastEv(c);return e&&e.type==='lost'}).length;if(n)b=`<span class="badge">${n}</span>`}
    return `<button data-act="go" data-tab="${k}" ${top===k?'aria-current="page"':''}>${l}${b}</button>`}).join('');
  const V = u.role==='prime'?PV:SV;
  document.getElementById('view').innerHTML=(V[u.tab]||V.dash)(u.param);
}

/* ================= 元請け ================= */
const PV = {};
PV.dash = () => {
  const open=S.cases.filter(c=>phase(c).k==='open');
  const wait=S.cases.filter(c=>pending(c).length&&!ended(c));
  const today=S.cases.filter(c=>sameDay(c.start,new Date().toISOString())&&!ended(c));
  const deliv=S.cases.filter(c=>c.delivery&&!c.confirmed);
  const claims=[];S.cases.forEach(c=>Object.entries(c.claims).forEach(([sid,cl])=>{if(cl.status==='submitted')claims.push({c,sid,cl})}));
  const lost=S.cases.filter(c=>{const e=lastEv(c);return e&&e.type==='lost'});
  const card=(title,list,cls,rowFn)=>`<section class="panel ${list.length?cls:''}"><div class="head"><h2>${title}</h2><span class="n">${list.length}</span></div>${list.length?list.map(rowFn).join(''):'<p class="empty">なし</p>'}</section>`;
  return `
  <div class="between"><div><div class="eyebrow">${esc(PRIME.name)}（元請け）</div><h1>未完了のタスク</h1></div>${pollLabel()}</div>
  ${lost.length?`<div class="alert-strip">失尾の報告があります：${lost.map(c=>esc(c.code)).join('、')}<button class="btn sm" data-act="go" data-tab="live">ライブ状況を見る</button></div>`:''}
  <div class="todo">
    ${card('アサイン未定',open,'fire',c=>caseRow(c,pill('未定','crit')))}
    ${card('下請けの回答待ち',wait,'hot',c=>caseRow(c,pill(pending(c).map(s=>subOf(s).name.split(' ')[0]).join('・'),'warn')))}
    ${card('本日の稼働',today,'',c=>caseRow(c,pill(phase(c).l,phase(c).c)))}
    ${card('納品の確認待ち',deliv,'hot',c=>caseRow(c,pill('確認する','warn')))}
    ${card('精算の承認待ち',claims,'hot',x=>`<button class="row" data-act="go" data-tab="money"><span class="t"><b>${esc(x.c.code)} ${esc(subOf(x.sid).name)}</b><span>延長${x.cl.ext}分・経費${x.cl.items.length}件</span></span>${pill(yen(claimTotal(x.c,x.cl)),'warn')}</button>`)}
  </div>
  <div class="hint"><b class="eyebrow" style="flex:none">メモ</b><span>件数はスプレッドシートの状態から毎回集計します。<b>タスク用の表は別に持たない</b>ので、「やったのに残っている」というズレが起きません。</span></div>`;
};
PV.cases = () => `
  <div class="between"><h1>案件一覧</h1><button class="btn primary" data-act="go" data-tab="new">＋ 新しい案件</button></div>
  <section class="panel tw"><table><thead><tr><th>案件番号</th><th>日時</th><th>エリア</th><th>種類</th><th>人数</th><th>状態</th></tr></thead><tbody>
  ${[...S.cases].sort((a,b)=>D(b.start)-D(a.start)).map(c=>{const p=phase(c);return `<tr><td><button class="btn sm" data-act="go" data-tab="case" data-id="${c.id}">${esc(c.code)}</button></td><td class="mono">${md(c.start)} ${hm(c.start)}</td><td>${esc(c.area)}</td><td>${esc(c.title)}</td><td class="mono">${accepted(c).length}/${c.head}</td><td>${pill(p.l,p.c)}</td></tr>`}).join('')}
  </tbody></table></section>`;

PV.new = () => `
  <div><button class="btn sm" data-act="go" data-tab="cases">← 一覧</button></div>
  <h1>新しい案件</h1>
  <form id="newForm" class="grid2" onsubmit="return false">
    <section class="panel"><h2>公開情報</h2><p class="small muted">依頼メールと募集一覧に載る情報。個人を特定できる内容は書かない。</p>
      <div class="form">
        <label class="f wide">調査の種類<input id="f_title" value="浮気調査（行動確認）"></label>
        <label class="f">開始日<input id="f_date" type="date" value="${dayAt(1,12,0).slice(0,10)}"></label>
        <label class="f">開始時刻<input id="f_time" type="time" value="18:00"></label>
        <label class="f">想定時間（h）<input id="f_hours" type="number" value="5" min="1"></label>
        <label class="f">必要人数<input id="f_head" type="number" value="2" min="1"></label>
        <label class="f">開始エリア（市区町村まで）<input id="f_area" value="埼玉県草加市"></label>
        <label class="f">時給（1名・2,700〜3,200円）<input id="f_fee" type="number" value="3000" min="2700" max="3200" step="100"></label>
        <label class="check wide"><input type="checkbox" id="f_public"> 募集一覧にも載せる（指名以外の下請けも応募できる）</label>
      </div></section>
    <section class="panel secret"><div class="lock">${LOCK}秘匿情報：受諾した下請けにだけ、調査終了まで表示されます</div>
      <div class="form">
        <label class="f">対象者氏名<input id="s_name" value="戊井 五郎"></label>
        <label class="f">特徴<input id="s_feature" value="40代男性・グレーのジャケット"></label>
        <label class="f wide">自宅住所<input id="s_addr" value="埼玉県草加市〇〇1-1-1"></label>
        <label class="f">勤務先<input id="s_work" value="〇〇株式会社"></label>
        <label class="f">車両<input id="s_car" value="なし"></label>
        <label class="f wide">事前情報<textarea id="s_pre" rows="3">水曜は残業と言って帰りが遅い（依頼者談）。</textarea></label>
        <label class="f wide">顔写真<input type="file" accept="image/*" disabled><span class="small">本番はDriveの非公開フォルダに保存し、受諾者にだけ期限付きで表示</span></label>
      </div></section>
    <div class="wide flex"><button class="btn primary" data-act="createCase">作成してアサインへ進む</button></div>
  </form>`;

PV.case = id => {
  const c=caseOf(id); if(!c) return PV.cases();
  const p=phase(c), s=c.secret;
  const rows=SUBS.map(sb=>{
    const a=c.assign[sb.id]; const st=a?a.status:null;
    const lab={offered:['回答待ち','warn'],applied:['応募あり','info'],accepted:['受諾済み','ok'],declined:['辞退','muted'],finished:['終了','muted']}[st];
    const lock=!!st&&st!=='declined';
    return `<tr><td><label class="check"><input type="checkbox" name="pick" value="${sb.id}" ${lock?'disabled':''}> <span>${esc(sb.name)}<br><span class="small muted">${esc(sb.org)}</span></span></label></td><td class="mono small">${esc(sb.lic)}</td><td>${lab?pill(lab[0],lab[1]):''}</td><td>${st==='applied'?`<button class="btn sm primary" data-act="confirmApply" data-id="${c.id}" data-sub="${sb.id}">確定する</button>`:''}</td></tr>`}).join('');
  const tl=timeline(c);
  return `
  <div><button class="btn sm" data-act="go" data-tab="cases">← 一覧</button></div>
  <div class="between"><div><div class="eyebrow mono">${esc(c.code)}</div><h1>${esc(c.title)}</h1></div>${pill(p.l,p.c)}</div>
  <div class="grid2">
    <section class="panel"><h2>公開情報</h2><dl class="kv">
      <dt>開始</dt><dd class="mono">${md(c.start)} ${hm(c.start)}〜（${c.hours}時間）</dd>
      <dt>開始エリア</dt><dd>${esc(c.area)}</dd><dt>人数</dt><dd>${c.head}名</dd>
      <dt>時給</dt><dd>${yen(c.fee)}／名（想定${c.hours}時間で${yen(c.fee*c.hours)}・延長も同じ時給）</dd>
      <dt>募集一覧</dt><dd>${c.public?'掲載中':'指名のみ'}</dd></dl></section>
    <section class="panel secret"><div class="lock">${LOCK}秘匿情報（元請けは常に閲覧可。下請けは受諾後〜調査終了まで）</div>
      <div class="flex" style="align-items:flex-start"><div class="face">${faceSvg}</div>
      <dl class="kv" style="flex:1;min-width:0"><dt>対象者</dt><dd>${esc(s.name)}</dd><dt>特徴</dt><dd>${esc(s.feature)}</dd><dt>住所</dt><dd>${esc(s.addr)}</dd><dt>勤務先</dt><dd>${esc(s.work)}</dd><dt>車両</dt><dd>${esc(s.car)}</dd><dt>事前情報</dt><dd>${esc(s.pre)}</dd></dl></div></section>
  </div>
  <section class="panel"><div class="between"><h2>指名アサイン</h2><span class="small muted">チェックした相手に依頼メールを送ります（対象者の情報はメールに載せません）</span></div>
    <div class="tw"><table><thead><tr><th>下請け</th><th>届出番号</th><th>状態</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="flex" style="margin-top:12px"><button class="btn primary" data-act="sendOffer" data-id="${c.id}" ${ended(c)?'disabled':''}>依頼メールを送る</button>
    <label class="check"><input type="checkbox" id="pubToggle" data-act="togglePublic" data-id="${c.id}" ${c.public?'checked':''}> 募集一覧にも載せる</label></div>
  </section>
  <div class="grid2">
    <section class="panel"><div class="between"><h2>現場の経過</h2>${c.events.length?pill(EV[lastEv(c).type].l,EV[lastEv(c).type].c):''}</div>${tl.length?`<ul class="timeline">${tl.map(x=>`<li><time>${hm(x.at)}</time><span>${x.html}</span></li>`).join('')}</ul>`:'<p class="muted small">まだ報告はありません。</p>'}</section>
    <section class="panel"><h2>納品・報告書</h2>
      ${c.delivery?`<dl class="kv"><dt>納品者</dt><dd>${esc(subOf(c.delivery.sub).name)}</dd><dt>日時</dt><dd class="mono">${md(c.delivery.at)} ${hm(c.delivery.at)}</dd><dt>保存先</dt><dd><a href="https://drive.google.com/" target="_blank" rel="noopener">${esc(c.delivery.url)}</a></dd></dl>`:'<p class="muted small">下請けがDriveへ証拠をアップロードし「納品完了」を押すと、ここに表示されます。</p>'}
      <div class="flex" style="margin-top:12px">
        <button class="btn" data-act="report" data-id="${c.id}" ${c.logs.length?'':'disabled'}>報告書をプレビュー</button>
        ${c.delivery&&!c.confirmed?`<button class="btn primary" data-act="confirmDelivery" data-id="${c.id}">納品を確認済みにする</button>`:''}
        ${c.confirmed?pill('納品確認済み','ok'):''}
      </div></section>
  </div>`;
};
function timeline(c){
  return [...c.events.map(e=>({at:e.at,html:`${pill(EV[e.type].l,EV[e.type].c)} <span class="small muted">${esc(subOf(e.sub).name)}</span>${e.note?` ${esc(e.note)}`:''}`})),
          ...c.logs.map(l=>({at:l.at,html:esc(l.body)}))].sort((a,b)=>D(a.at)-D(b.at));
}
PV.live = () => {
  const list=S.cases.filter(c=>(c.events.length&&!c.confirmed&&!c.delivery)||(sameDay(c.start,new Date().toISOString())&&accepted(c).length));
  return `<div class="between"><h1>ライブ状況</h1>${pollLabel()}</div>
  <div class="live">${list.length?list.map(c=>{const e=lastEv(c);const crit=e&&e.type==='lost';const logs=c.logs.slice(-3).reverse();
    return `<section class="panel ${crit?'crit':''}"><div class="between"><span class="eyebrow mono">${esc(c.code)}</span>${e?pill(EV[e.type].l,EV[e.type].c):pill('開始前')}</div>
    <h2 style="margin-top:6px">${esc(c.area)}・${esc(c.title)}</h2>
    <p class="small muted" style="margin:0 0 8px">担当：${accepted(c).map(s=>esc(subOf(s).name)).join('、')||'—'}${e?`　最終報告 <span class="mono">${hm(e.at)}</span>`:''}</p>
    ${logs.length?`<ul class="timeline">${logs.map(l=>`<li><time>${hm(l.at)}</time><span>${esc(l.body)}</span></li>`).join('')}</ul>`:''}
    <div style="margin-top:10px"><button class="btn sm" data-act="go" data-tab="case" data-id="${c.id}">詳細</button></div></section>`}).join(''):'<p class="muted">稼働中の案件はありません。</p>'}</div>
  <div class="hint"><b class="eyebrow" style="flex:none">メモ</b><span>GASではWebSocketが使えないため、<b>15秒ごとに自動で最新状況を取りに行きます</b>。失尾だけは元請けにメールでも即時通知します。</span></div>`;
};
function claimTotal(c,cl){return Math.ceil(cl.ext/30)*c.fee/2 + cl.items.reduce((a,i)=>a+Number(i.amt||0),0)}
function claimDetail(c,cl){return `<ul class="small" style="margin:6px 0;padding-left:1.2em">${cl.ext?`<li>延長 ${cl.ext}分：${yen(Math.ceil(cl.ext/30)*c.fee/2)}</li>`:''}${cl.items.map(i=>`<li>${KINDS[i.k]}${i.memo?`（${esc(i.memo)}）`:''}：${yen(i.amt)}</li>`).join('')}</ul>`}
PV.money = () => {
  const all=[];S.cases.forEach(c=>Object.entries(c.claims).forEach(([sid,cl])=>{if(cl.status!=='draft')all.push({c,sid,cl})}));
  const lab={submitted:['承認待ち','warn'],approved:['承認済み','ok'],rejected:['差し戻し','crit']};
  return `<h1>精算（延長・経費）</h1>
  <div class="grid2">${all.length?all.map(({c,sid,cl})=>`<section class="panel"><div class="between"><span class="eyebrow mono">${esc(c.code)}</span>${pill(lab[cl.status][0],lab[cl.status][1])}</div>
  <h2 style="margin-top:6px">${esc(subOf(sid).name)}（${esc(subOf(sid).org)}）</h2>${claimDetail(c,cl)}
  <div class="between"><span class="mono" style="font-size:18px">${yen(claimTotal(c,cl))}</span>
  ${cl.status==='submitted'?`<span class="flex"><button class="btn sm danger" data-act="claimReject" data-id="${c.id}" data-sub="${sid}">差し戻す</button><button class="btn sm primary" data-act="claimApprove" data-id="${c.id}" data-sub="${sid}">承認する</button></span>`:''}</div>
  ${cl.reason?`<p class="small" style="color:var(--crit)">差し戻し理由：${esc(cl.reason)}</p>`:''}</section>`).join(''):'<p class="muted">申請はまだありません。</p>'}</div>`;
};
function pollLabel(){return `<span class="poll"><span class="dot"></span>自動更新 ${POLL}秒ごと（次の更新まで <span class="mono" id="cd">${cd}</span>秒）</span>`}

/* ================= 下請け ================= */
const SV = {};
const me = () => S.ui.sub;
SV.dash = () => {
  const sid=me(), my=S.cases.filter(c=>c.assign[sid]);
  const offers=my.filter(c=>c.assign[sid].status==='offered');
  const soon=my.filter(c=>c.assign[sid].status==='accepted'&&!ended(c)&&D(c.start)-Date.now()<48*3600e3);
  const nodeliv=my.filter(c=>ended(c)&&accepted(c).includes(sid)&&!c.delivery);
  const noclaim=my.filter(c=>ended(c)&&accepted(c).includes(sid)&&(!c.claims[sid]||c.claims[sid].status==='draft'||c.claims[sid].status==='rejected'));
  const card=(title,list,cls,tab,ex)=>`<section class="panel ${list.length?cls:''}"><div class="head"><h2>${title}</h2><span class="n">${list.length}</span></div>${list.length?list.map(c=>caseRow(c,ex(c),tab)).join(''):'<p class="empty">なし</p>'}</section>`;
  return `<div><div class="eyebrow">${esc(subOf(sid).org)}（下請け）</div><h1>${esc(subOf(sid).name)}さんの未完了タスク</h1></div>
  <div class="todo">
    ${card('回答待ちの依頼',offers,'fire','answer',()=>pill('回答する','crit'))}
    ${card('今日・明日の予定',soon,'',('field'),c=>pill(c.events.length?'調査中':'予定','info'))}
    ${card('納品が未完了',nodeliv,'hot','field',()=>pill('納品する','warn'))}
    ${card('精算が未申請',noclaim,'hot','money',c=>pill(c.claims[sid]?.status==='rejected'?'差し戻し':'申請する','warn'))}
  </div>`;
};
SV.mail = () => {
  const list=S.mails.filter(m=>m.to===me()).sort((a,b)=>D(b.at)-D(a.at));
  return `<h1>メール（受信箱のイメージ）</h1>
  <p class="small muted" style="margin:0">本番では各自のメールアドレスに届きます。受諾・辞退はメール内のリンクからWebで行います。</p>
  <section class="panel" style="display:grid;gap:8px">${list.length?list.map(m=>{const c=caseOf(m.caseId);return `<button class="mail ${m.read?'':'unread'}" data-act="openMail" data-id="${m.id}"><b>${esc(mailSubject(m,c))}</b><span class="small muted mono">${md(m.at)} ${hm(m.at)}</span></button>`}).join(''):'<p class="muted">メールはありません。</p>'}</section>`;
};
function mailSubject(m,c){return m.kind==='offer'?`【調査依頼】${md(c.start)} ${hm(c.start)}〜 ${c.area}`:`【アサイン確定】${md(c.start)} ${c.area}`}
function mailBody(m,c){
  const s=subOf(m.to);
  if(m.kind==='confirmed') return `${s.name} 様\n\n応募いただいた下記案件のアサインが確定しました。\n対象者などの詳細は、ログイン後の案件ページでご確認ください。\n\n■ 日時：${md(c.start)} ${hm(c.start)}〜（約${c.hours}時間）\n■ 開始エリア：${c.area}\n\n${PRIME.name}`;
  return `${s.name} 様\n\nいつもありがとうございます。${PRIME.name}です。\n下記の案件をお願いしたく、ご連絡しました。\n\n■ 調査の種類：${c.title}\n■ 日時：${md(c.start)} ${hm(c.start)}〜（約${c.hours}時間）\n■ 開始エリア：${c.area}\n■ 時給：${yen(c.fee)}（想定${c.hours}時間で${yen(c.fee*c.hours)}）\n\nお受けいただける場合は、下のページから「受諾」を押してください。\n対象者の情報は、受諾後にページ上でのみ表示します。\n\n▶ 回答ページ（ログインが必要です）\n\n${PRIME.name}`;
}
SV.board = () => {
  const sid=me();
  const list=S.cases.filter(c=>c.public&&!ended(c)&&accepted(c).length<c.head);
  return `<h1>募集中の案件</h1><p class="small muted" style="margin:0">ここには公開情報だけが表示されます。</p>
  <section class="panel tw"><table><thead><tr><th>開始</th><th>エリア</th><th>種類</th><th>人数</th><th>時給</th><th></th></tr></thead><tbody>
  ${list.length?list.map(c=>{const a=c.assign[sid];return `<tr><td class="mono">${md(c.start)} ${hm(c.start)}</td><td>${esc(c.area)}</td><td>${esc(c.title)}</td><td class="mono">${accepted(c).length}/${c.head}</td><td class="mono">${yen(c.fee)}/h</td><td>${a?pill({applied:'応募済み',offered:'指名あり',accepted:'確定',declined:'辞退'}[a.status]||a.status,'info'):`<button class="btn sm primary" data-act="apply" data-id="${c.id}">応募する</button>`}</td></tr>`}).join(''):'<tr><td colspan="6" class="muted">募集中の案件はありません。</td></tr>'}
  </tbody></table></section>`;
};
SV.answer = id => {
  const c=caseOf(id), sid=me(), a=c&&c.assign[sid];
  if(!c||!a) return `<p class="muted">この案件への依頼はありません。</p>`;
  const pub=`<section class="panel"><h2>案件の概要</h2><dl class="kv"><dt>種類</dt><dd>${esc(c.title)}</dd><dt>開始</dt><dd class="mono">${md(c.start)} ${hm(c.start)}〜（約${c.hours}時間）</dd><dt>開始エリア</dt><dd>${esc(c.area)}</dd><dt>時給</dt><dd>${yen(c.fee)}（想定${c.hours}時間で${yen(c.fee*c.hours)}）</dd></dl></section>`;
  let act='';
  if(a.status==='offered') act=`<section class="panel"><h2>回答</h2>
    <label class="check"><input type="checkbox" id="nda"> 調査で知り得た情報を第三者に漏らさず、調査終了後は複製・保存しないことに同意します（探偵業法の秘密保持義務）</label>
    <div class="flex" style="margin-top:12px"><button class="btn primary" data-act="accept" data-id="${c.id}">受諾する</button><button class="btn danger" data-act="decline" data-id="${c.id}">辞退する</button></div></section>`;
  else act=`<section class="panel"><p style="margin:0">${a.status==='declined'?'この依頼は辞退済みです。':'受諾済みです。'}</p>${a.status==='accepted'?`<div style="margin-top:10px"><button class="btn primary" data-act="go" data-tab="scase" data-id="${c.id}">案件の詳細を見る</button></div>`:''}</section>`;
  return `<div><button class="btn sm" data-act="go" data-tab="mail">← メール</button></div><div><div class="eyebrow mono">${esc(c.code)}</div><h1>調査依頼への回答</h1></div>${pub}${secretBox(c,sid)}${act}`;
};
function secretBox(c,sid){
  const ok=canSee(c,sid), s=c.secret, a=c.assign[sid];
  const why = ok?'受諾済みのため表示中。調査終了と同時に見えなくなります。'
    : (a&&(a.status==='finished'||ended(c))) ? '調査終了のため閲覧期限が切れました。'
    : '受諾すると表示されます。';
  const v = t => ok?esc(t):'<span class="mask">●●●●●●</span>';
  return `<section class="panel secret"><div class="lock">${LOCK}${why}</div>
  <div class="flex" style="align-items:flex-start"><div class="face ${ok?'':'blur'}">${faceSvg}</div>
  <dl class="kv" style="flex:1;min-width:0"><dt>対象者</dt><dd>${v(s.name)}</dd><dt>特徴</dt><dd>${v(s.feature)}</dd><dt>住所</dt><dd>${v(s.addr)}</dd><dt>勤務先</dt><dd>${v(s.work)}</dd><dt>車両</dt><dd>${v(s.car)}</dd><dt>事前情報</dt><dd>${v(s.pre)}</dd></dl></div>
  ${ok?`<p class="small muted" style="margin:10px 0 0">閲覧者：${esc(subOf(sid).name)}　${md(new Date().toISOString())} ${hm(new Date().toISOString())}（画面に透かしとして表示）</p>`:''}</section>`;
}
SV.scase = id => {
  const c=caseOf(id), sid=me();
  if(!c||!c.assign[sid]) return SV.board();
  return `<div><button class="btn sm" data-act="go" data-tab="dash">← ダッシュボード</button></div>
  <div><div class="eyebrow mono">${esc(c.code)}</div><h1>${esc(c.title)}</h1></div>
  <section class="panel"><dl class="kv"><dt>開始</dt><dd class="mono">${md(c.start)} ${hm(c.start)}〜（約${c.hours}時間）</dd><dt>開始エリア</dt><dd>${esc(c.area)}</dd><dt>時給</dt><dd>${yen(c.fee)}（想定${c.hours}時間で${yen(c.fee*c.hours)}）</dd></dl></section>
  ${secretBox(c,sid)}
  <div><button class="btn primary" data-act="go" data-tab="field" data-id="${c.id}">現場モードを開く</button></div>`;
};
SV.field = id => {
  const sid=me();
  const mine=S.cases.filter(c=>accepted(c).includes(sid)&&!c.confirmed);
  if(!mine.length) return `<h1>現場モード</h1><p class="muted">担当中の案件はありません。メールの依頼を受諾すると、ここに表示されます。</p>`;
  const c=(id&&mine.find(x=>x.id===id))||mine.find(x=>!ended(x))||mine[0];
  const e=lastEv(c), done=ended(c);
  const btn=(t,cls,dis)=>`<button class="${cls||EV[t].c}" data-act="ev" data-id="${c.id}" data-type="${t}" ${done||dis?'disabled':''}>${EV[t].l}</button>`;
  const mylogs=c.logs.filter(l=>l.sub===sid).sort((a,b)=>D(b.at)-D(a.at));
  const now=new Date(); const nowVal=`${p2(now.getHours())}:${p2(now.getMinutes())}`;
  return `<div class="between"><h1>現場モード</h1>${mine.length>1?`<select class="inp" style="width:auto" data-act="pickField" aria-label="案件を選ぶ">${mine.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.code)} ${esc(x.area)}</option>`).join('')}</select>`:''}</div>
  <div class="now"><div><div class="eyebrow mono">${esc(c.code)}・${esc(c.area)}</div><div class="big">${e?EV[e.type].l:'開始前'}</div></div>${e?`<span class="mono muted" style="margin-left:auto">${hm(e.at)} 報告</span>`:''}</div>
  <div class="field-btns">${btn('arrived')}${btn('stakeout')}${btn('moving')}${btn('lost')}${btn('found')}${btn('end','end')}</div>
  ${!done?`<section class="panel"><h2>行動記録</h2>
    <div class="flex"><input class="inp mono" id="logTime" type="time" value="${nowVal}" style="width:7.5em" aria-label="時刻"><input class="inp" id="logBody" style="flex:1" placeholder="例：対象者が駅前のカフェへ入店" aria-label="内容"><button class="btn primary" data-act="addLog" data-id="${c.id}">記録</button></div>
  </section>`:''}
  ${done?deliveryBox(c,sid):''}
  <section class="panel"><h2>自分の記録（${mylogs.length}件）</h2>${mylogs.length?`<ul class="timeline">${mylogs.map(l=>`<li><time>${hm(l.at)}</time><span>${esc(l.body)}</span></li>`).join('')}</ul>`:'<p class="muted small">まだ記録はありません。</p>'}</section>
  <div class="flex"><button class="btn sm" data-act="go" data-tab="scase" data-id="${c.id}">対象者の情報を見る</button></div>`;
};
function deliveryBox(c,sid){
  if(c.delivery) return `<section class="panel"><h2>納品</h2><p style="margin:0">${pill(c.confirmed?'元請け確認済み':'納品済み・元請けの確認待ち',c.confirmed?'ok':'warn')}</p></section>`;
  return `<section class="panel"><h2>納品</h2><p class="small muted" style="margin-top:0">写真・動画をGoogleドライブの案件フォルダへアップロードしたら、納品完了を押してください。対象者の情報は調査終了とともに非表示になっています。</p>
  <div class="flex"><input class="inp" id="drv" style="flex:1" value="https://drive.google.com/drive/folders/（案件フォルダ）" aria-label="保存先のURL"><button class="btn primary" data-act="deliver" data-id="${c.id}">納品完了</button></div></section>`;
}
SV.money = () => {
  const sid=me();
  const list=S.cases.filter(c=>ended(c)&&accepted(c).includes(sid));
  if(!list.length) return `<h1>精算</h1><p class="muted">調査が終わった案件があると、ここから延長時間と経費を申請できます。</p>`;
  return `<h1>精算（延長・経費）</h1><div class="grid2">${list.map(c=>{
    const cl=c.claims[sid]||{ext:0,items:[],status:'draft'};
    const edit=cl.status==='draft'||cl.status==='rejected';
    const lab={draft:['未申請','crit'],submitted:['承認待ち','warn'],approved:['承認済み','ok'],rejected:['差し戻し','crit']}[cl.status];
    return `<section class="panel"><div class="between"><span class="eyebrow mono">${esc(c.code)}</span>${pill(lab[0],lab[1])}</div><h2 style="margin-top:6px">${md(c.start)} ${esc(c.area)}</h2>
    ${cl.reason?`<p class="small" style="color:var(--crit)">差し戻し理由：${esc(cl.reason)}</p>`:''}
    ${edit?`<div class="form">
      <label class="f">延長（分）<input id="ext_${c.id}" type="number" step="30" min="0" value="${cl.ext}"></label>
      <label class="f">種類<select id="k_${c.id}">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="f">金額<input id="a_${c.id}" type="number" min="0" placeholder="1200"></label>
      <div class="f" style="align-self:end"><button class="btn" data-act="addItem" data-id="${c.id}">経費を追加</button></div>
    </div>`:''}
    ${claimDetail(c,cl)}
    <div class="between"><span class="mono" style="font-size:18px">${yen(claimTotal(c,cl))}</span>${edit?`<button class="btn primary" data-act="submitClaim" data-id="${c.id}">元請けに申請</button>`:''}</div></section>`}).join('')}</div>`;
};

/* ---------- 報告書 ---------- */
function reportHtml(c){
  const items=[...c.events.filter(e=>e.type!=='moving'&&e.type!=='end').map(e=>({at:e.at,t:{arrived:'調査員が現場に到着',stakeout:'張り込みを開始',lost:'対象者を見失う',found:'対象者を再び確認'}[e.type]+(e.note?`（${e.note}）`:'')})),...c.logs.map(l=>({at:l.at,t:l.body}))]
    .sort((a,b)=>D(a.at)-D(b.at));
  let day='';const rows=items.map(x=>{const d=reiwa(x.at);const h=d!==day?`<tr><td colspan="2"><b>${d}</b></td></tr>`:'';day=d;return h+`<tr><td>${jhm(x.at)}</td><td>${esc(x.t)}</td></tr>`}).join('');
  return `<div class="report"><h3>調査報告書</h3>
  <table><tr><th>案件番号</th><td>${esc(c.code)}</td></tr><tr><th>調査の種類</th><td>${esc(c.title)}</td></tr><tr><th>調査日</th><td>${reiwa(c.start)}</td></tr><tr><th>調査地域</th><td>${esc(c.area)}ほか</td></tr><tr><th>対象者</th><td>${esc(c.secret.name)}（${esc(c.secret.feature)}）</td></tr><tr><th>担当調査員</th><td>${accepted(c).map(s=>esc(subOf(s).name)).join('、')}</td></tr></table>
  <p style="margin:18px 0 6px"><b>調査経過</b></p><table class="tl">${rows}</table>
  <p class="end">以上</p></div>`;
}

/* ---------- 操作 ---------- */
const ACT = {
  role:d=>{S.ui.role=d.role;S.ui.tab='dash';S.ui.param=null;if(d.role==='prime'){const n=S.alerts.filter(a=>!a.read).length;if(n)toast(`新しい通知が${n}件あります`)}},
  go:d=>{S.ui.tab=d.tab;S.ui.param=d.id||null;window.scrollTo(0,0)},
  reset:()=>{S=seed();seedMails();toast('デモを初期状態に戻しました')},
  alerts:()=>{modal(`<div class="between"><h2 style="margin:0">通知</h2><button class="btn sm" data-act="close">閉じる</button></div>${S.alerts.length?S.alerts.slice().reverse().map(a=>`<div class="row" style="cursor:default"><span class="t"><b>${esc(a.text)}</b><span class="mono">${md(a.at)} ${hm(a.at)}</span></span></div>`).join(''):'<p class="muted">通知はありません。</p>'}<p class="small muted">失尾・受諾・辞退・納品・精算申請は、元請けのメールにも届きます。</p>`);S.alerts.forEach(a=>a.read=true);return 'keep'},
  close:()=>{closeModal();return 'keep'},
  createCase:()=>{
    const g=id=>document.getElementById(id).value.trim();
    const date=g('f_date');if(!date){toast('開始日を入れてください');return 'keep'}
    const start=new Date(`${date}T${g('f_time')||'09:00'}:00`).toISOString();
    S.seq++;const d=D(start);
    const c={id:'c'+Date.now(),code:`R8-${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(S.seq)}`,title:g('f_title'),start,hours:+g('f_hours')||1,area:g('f_area'),fee:+g('f_fee')||0,head:+g('f_head')||1,public:document.getElementById('f_public').checked,
      secret:{name:g('s_name'),feature:g('s_feature'),addr:g('s_addr'),work:g('s_work'),car:g('s_car'),pre:g('s_pre')},assign:{},events:[],logs:[],claims:{},delivery:null,confirmed:false};
    S.cases.push(c);S.ui.tab='case';S.ui.param=c.id;toast('案件を作成しました。依頼する相手を選んでください');
  },
  togglePublic:(d,el)=>{caseOf(d.id).public=el.checked;toast(el.checked?'募集一覧に掲載しました':'募集一覧から外しました')},
  sendOffer:d=>{
    const c=caseOf(d.id);const ids=[...document.querySelectorAll('input[name=pick]:checked')].map(x=>x.value);
    if(!ids.length){toast('依頼する相手にチェックを入れてください');return 'keep'}
    ids.forEach(sid=>{c.assign[sid]={status:'offered',at:new Date().toISOString()};S.mails.push({id:'m'+Date.now()+sid,to:sid,caseId:c.id,at:new Date().toISOString(),kind:'offer',read:false})});
    const m=S.mails[S.mails.length-1];
    modal(`<div class="between"><h2 style="margin:0">依頼メールを${ids.length}名に送りました</h2><button class="btn sm" data-act="close">閉じる</button></div>
    <p class="small muted" style="margin:0">送信先：${ids.map(s=>esc(subOf(s).name)+'（'+esc(subOf(s).email)+'）').join('、')}</p>
    <div><b>${esc(mailSubject(m,c))}</b></div><pre class="mailbody">${esc(mailBody(m,c))}</pre>
    <p class="small muted">対象者の氏名・住所・写真はメールに載せません。右上を「下請け」に切り替えると受信箱を確認できます。</p>`);
  },
  confirmApply:d=>{const c=caseOf(d.id);c.assign[d.sub]={status:'accepted',at:new Date().toISOString()};S.mails.push({id:'m'+Date.now(),to:d.sub,caseId:c.id,at:new Date().toISOString(),kind:'confirmed',read:false});toast(`${subOf(d.sub).name}さんで確定しました`)},
  confirmDelivery:d=>{caseOf(d.id).confirmed=true;toast('納品を確認済みにしました')},
  report:d=>{const c=caseOf(d.id);modal(`<div class="between"><h2 style="margin:0">報告書プレビュー（自動作成）</h2><button class="btn sm" data-act="close">閉じる</button></div>
    <p class="small muted" style="margin:0">現場の行動記録とステータスから自動で作った下書きです。本番ではGoogleドキュメントの雛形に流し込み、Word（.docx）またはPDFで保存します。</p>${reportHtml(c)}
    <div class="flex"><button class="btn" disabled>Wordで保存（本番で有効）</button><button class="btn" disabled>PDFで保存（本番で有効）</button></div>`);return 'keep'},
  claimApprove:d=>{caseOf(d.id).claims[d.sub].status='approved';toast('承認しました')},
  claimReject:d=>{const cl=caseOf(d.id).claims[d.sub];cl.status='rejected';cl.reason='領収書の写真を添付してください';toast('差し戻しました')},
  /* 下請け */
  openMail:d=>{const m=S.mails.find(x=>x.id===d.id);m.read=true;const c=caseOf(m.caseId);save();render();
    modal(`<div class="between"><h2 style="margin:0">${esc(mailSubject(m,c))}</h2><button class="btn sm" data-act="close">閉じる</button></div><p class="small muted" style="margin:0">差出人：${esc(PRIME.name)}</p><pre class="mailbody">${esc(mailBody(m,c))}</pre>
    <div><button class="btn primary" data-act="mailGo" data-id="${c.id}" data-kind="${m.kind}">${m.kind==='offer'?'回答ページを開く':'案件ページを開く'}</button></div>`);return 'keep'},
  mailGo:d=>{closeModal();S.ui.tab=d.kind==='offer'?'answer':'scase';S.ui.param=d.id},
  accept:d=>{
    if(!document.getElementById('nda').checked){toast('秘密保持への同意にチェックを入れてください');return 'keep'}
    const c=caseOf(d.id);c.assign[me()].status='accepted';S.alerts.push({at:new Date().toISOString(),text:`${subOf(me()).name}さんが ${c.code} を受諾しました`,read:false});toast('受諾しました。対象者の情報が表示されます');
  },
  decline:d=>{const c=caseOf(d.id);c.assign[me()].status='declined';S.alerts.push({at:new Date().toISOString(),text:`${subOf(me()).name}さんが ${c.code} を辞退しました`,read:false});toast('辞退しました')},
  apply:d=>{const c=caseOf(d.id);c.assign[me()]={status:'applied',at:new Date().toISOString()};S.alerts.push({at:new Date().toISOString(),text:`${subOf(me()).name}さんが ${c.code} に応募しました`,read:false});toast('応募しました。元請けが確定すると詳細が見られます')},
  ev:d=>{
    const c=caseOf(d.id);const now=new Date().toISOString();
    c.events.push({sub:me(),type:d.type,at:now});
    if(d.type==='lost')S.alerts.push({at:now,text:`【失尾】${c.code} ${subOf(me()).name}さん`,read:false});
    if(d.type==='end'){Object.values(c.assign).forEach(a=>{if(a.status==='accepted')a.status='finished'});c.logs.push({id:'l'+Date.now(),sub:me(),at:now,body:'本日の調査を終了。'});S.alerts.push({at:now,text:`${c.code} の調査が終了しました`,read:false});toast('調査終了。対象者の情報は非表示になりました')}
    else toast(`「${EV[d.type].l}」を報告しました`);
    S.ui.param=c.id;
  },
  addLog:d=>{
    const c=caseOf(d.id);const body=document.getElementById('logBody').value.trim();const t=document.getElementById('logTime').value;
    if(!body){toast('内容を入力してください');return 'keep'}
    const at=new Date();if(t){const [h,m]=t.split(':');at.setHours(+h,+m,0,0)}
    c.logs.push({id:'l'+Date.now(),sub:me(),at:at.toISOString(),body});S.ui.param=c.id;toast('記録しました');
  },
  deliver:d=>{const c=caseOf(d.id);c.delivery={sub:me(),url:document.getElementById('drv').value.trim(),at:new Date().toISOString()};S.alerts.push({at:new Date().toISOString(),text:`${c.code} が納品されました`,read:false});S.ui.param=c.id;toast('納品完了を報告しました')},
  addItem:d=>{
    const c=caseOf(d.id),sid=me();const amt=+document.getElementById('a_'+c.id).value;
    if(!amt){toast('金額を入力してください');return 'keep'}
    const cl=c.claims[sid]||(c.claims[sid]={ext:0,items:[],status:'draft'});
    cl.ext=+document.getElementById('ext_'+c.id).value||0;cl.items.push({k:document.getElementById('k_'+c.id).value,amt});
  },
  submitClaim:d=>{
    const c=caseOf(d.id),sid=me();const cl=c.claims[sid]||(c.claims[sid]={ext:0,items:[],status:'draft'});
    cl.ext=+document.getElementById('ext_'+c.id).value||0;
    if(!cl.ext&&!cl.items.length){toast('延長時間か経費を入力してください');return 'keep'}
    cl.status='submitted';delete cl.reason;S.alerts.push({at:new Date().toISOString(),text:`${subOf(sid).name}さんから ${c.code} の精算申請`,read:false});toast('元請けに申請しました');
  }
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  if(b.type==='checkbox'&&b.dataset.act!=='togglePublic')return;
  const fn=ACT[b.dataset.act];if(!fn)return;
  const r=fn(b.dataset,b);save();if(r!=='keep')render();
  if(r==='keep'){const bell=document.getElementById('bell');const n=S.alerts.filter(a=>!a.read).length;bell.innerHTML=`通知${n?` <span class="badge">${n}</span>`:''}`}
});
document.addEventListener('change',e=>{
  if(e.target.id==='who'){S.ui.sub=e.target.value;S.ui.tab='dash';S.ui.param=null;save();render()}
  if(e.target.dataset.act==='pickField'){S.ui.param=e.target.value;save();render()}
});

/* ---------- 自動更新（ポーリングの見え方） ---------- */
let cd=POLL;
setInterval(()=>{
  cd--; if(cd<=0){cd=POLL; if(S.ui.role==='prime'&&(S.ui.tab==='live'||S.ui.tab==='dash')&&document.getElementById('modal').hidden){render()}}
  const el=document.getElementById('cd'); if(el) el.textContent=cd;
},1000);

load();render();
</script>
</body>
</html>
